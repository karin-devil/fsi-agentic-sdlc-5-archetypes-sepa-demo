-- ============================================================================
-- EuroBank Enterprise Knowledge Graph on Cloud Spanner Graph
-- Reference: agentic-sdlc-workflows
-- Deck: Agentic SDLC Offering - V1.0
-- Database URI: projects/coba-sdlc-yellow-prod/instances/coba-adlc-kg/databases/enterprise_knowledge_graph
-- ============================================================================

CREATE PROPERTY GRAPH IF NOT EXISTS EuroBankEnterpriseSDLCGraph
  NODE TABLES (
    CodeArtifact KEY (artifact_id)
      LABEL CodeArtifact PROPERTIES (artifact_id, repo_name, file_path, symbol_name, language, loc_count, gcs_snapshot_uri),
    DatabaseEntity KEY (db_entity_id)
      LABEL DatabaseEntity PROPERTIES (db_entity_id, db_system, schema_name, table_or_proc_name, zone_tier),
    RequirementStory KEY (story_id)
      LABEL RequirementStory PROPERTIES (story_id, plm_jira_key, title, app_ramo_domain, ambiguity_score, status),
    ComplianceDocument KEY (doc_id)
      LABEL ComplianceDocument PROPERTIES (doc_id, title, regulation_framework, gcs_pdf_uri, last_verified_at)
  )
  EDGE TABLES (
    CodeDependency KEY (src_artifact_id, dst_artifact_id, dep_type)
      SOURCE KEY (src_artifact_id) REFERENCES CodeArtifact (artifact_id)
      DESTINATION KEY (dst_artifact_id) REFERENCES CodeArtifact (artifact_id)
      LABEL DEPENDS_ON PROPERTIES (dep_type, call_frequency, is_cross_repo),
    DataAccessEdge KEY (artifact_id, db_entity_id, access_mode)
      SOURCE KEY (artifact_id) REFERENCES CodeArtifact (artifact_id)
      DESTINATION KEY (db_entity_id) REFERENCES DatabaseEntity (db_entity_id)
      LABEL ACCESSES_DATA PROPERTIES (access_mode, transactional_isolation),
    StoryImplementation KEY (story_id, artifact_id)
      SOURCE KEY (story_id) REFERENCES RequirementStory (story_id)
      DESTINATION KEY (artifact_id) REFERENCES CodeArtifact (artifact_id)
      LABEL IMPLEMENTS_STORY PROPERTIES (confidence_score, commit_sha),
    RegulatoryGovernance KEY (artifact_id, doc_id)
      SOURCE KEY (artifact_id) REFERENCES CodeArtifact (artifact_id)
      DESTINATION KEY (doc_id) REFERENCES ComplianceDocument (doc_id)
      LABEL GOVERNED_BY PROPERTIES (bafin_section, mandatory_audit)
  );

-- ============================================================================
-- Query 1: Architecture Impact Analysis Agent (Multi-Hop Cross-Repo GQL)
-- Replaces 45+ minutes of manual/agent grep/glob across ~10M LoC with a 180ms query
-- ============================================================================
GRAPH EuroBankEnterpriseSDLCGraph
MATCH (story:RequirementStory {plm_jira_key: 'APPRAMO-4821'})
      -[:IMPLEMENTS_STORY]->(entry:CodeArtifact)
      -[:DEPENDS_ON]->{1,4}(downstream:CodeArtifact)
OPTIONAL MATCH (downstream)-[:ACCESSES_DATA]->(db:DatabaseEntity)
OPTIONAL MATCH (downstream)-[:GOVERNED_BY]->(reg:ComplianceDocument)
RETURN
  story.plm_jira_key AS jira_story,
  entry.repo_name AS source_repo,
  entry.symbol_name AS modified_symbol,
  downstream.repo_name AS impacted_repo,
  downstream.file_path AS impacted_file,
  downstream.symbol_name AS impacted_symbol,
  db.table_or_proc_name AS impacted_db_object,
  reg.title AS governing_compliance_pdf,
  reg.bafin_section AS regulatory_clause;

-- ============================================================================
-- Query 2: Doku Agent PoC — Living Documentation & Ontology Extraction Query
-- ============================================================================
GRAPH EuroBankEnterpriseSDLCGraph
MATCH (c:CodeArtifact {repo_name: 'coba-sepa-payments-core'})
      -[dep:DEPENDS_ON]->(target:CodeArtifact)
OPTIONAL MATCH (c)-[:GOVERNED_BY]->(doc:ComplianceDocument)
RETURN
  c.symbol_name AS component_symbol,
  c.file_path AS source_path,
  dep.dep_type AS dependency_kind,
  target.repo_name AS target_repo,
  target.symbol_name AS target_symbol,
  doc.title AS compliance_doc,
  doc.bafin_section AS bafin_clause;
